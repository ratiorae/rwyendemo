<html>

<head>
    <title>Links — RACHEL W.YEN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="@rachelwyen elsewhere on the web">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Links page specific styles ── */
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .links-wrap {
            max-width: 480px;
            width: 100%;
            text-align: center;
        }

        .links-name {
            color: #fff;
            font-size: clamp(24px, 6vw, 40px);
            margin: 0 0 6px 0;
            font-family: var(--font-main);
            letter-spacing: 0.05em;
        }

        .links-handle {
            color: rgba(255,255,255,0.6);
            font-size: clamp(14px, 3vw, 18px);
            margin: 0 0 30px 0;
            font-family: var(--font-main);
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 30px;
        }

        .link-btn {
            background-color: var(--marquee-bg);
            color: #fff;
            border-radius: 20px;
            padding: 14px 20px;
            font-size: clamp(18px, 4vw, 24px);
            font-family: var(--font-main);
            box-shadow: 6px 6px 0 var(--shadow-dark),
                        10px 10px 0 var(--shadow-darker);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .link-btn:hover {
            animation: shake 0.7s;
            animation-iteration-count: 1;
        }

        .link-btn a {
            color: #fff !important;
            text-decoration: none;
            width: 100%;
        }

        .link-btn.alt {
            background-color: var(--button-bg); /* purple for website link */
        }

        .links-footer {
            color: rgba(255,255,255,0.5);
            font-size: clamp(12px, 2vw, 14px);
            font-family: var(--font-main);
        }

        .links-footer a {
            color: rgba(255,255,255,0.7) !important;
        }
    </style>
</head>

<body>
    <div class="links-wrap">

        <p class="links-name">RACHEL W.YEN</p>
        <p class="links-handle">@rachelwyen elsewhere on the web</p>

        <div class="links-list">
            <div class="link-btn">
                <a href="https://instagram.com/ratiorae" target="_blank">
                    📸 Instagram
                </a>
            </div>
            <div class="link-btn">
                <a href="https://www.tiktok.com/@goldsundrops" target="_blank">
                    🎵 TikTok
                </a>
            </div>
            <div class="link-btn">
                <a href="https://goldsundrops.substack.com/" target="_blank">
                    ✉️ Substack
                </a>
            </div>
            <div class="link-btn">
                <a href="https://www.youtube.com/@rachelwyen" target="_blank">
                    ▶️ YouTube
                </a>
            </div>
            <div class="link-btn">
                <a href="https://buymeacoffee.com/ratiorae" target="_blank">
                    ☕️ Buy Me A Coffee
                </a>
            </div>
            <div class="link-btn">
                <a href="https://linkedin.com/in/rachelwyen" target="_blank">
                    💼 LinkedIn
                </a>
            </div>
            <div class="link-btn alt">
                <a href="https://rachelwyen.com" target="_blank">
                    🏠 rachelwyen.com
                </a>
            </div>
        </div>

        <p class="links-footer">© Rachel W. Yen 2025 · <a href="https://rachelwyen.com">rachelwyen.com</a></p>

    </div>
</body>

</html>
